<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050505">
  <title>Nokia Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone" aria-label="Nokia Snake phone">

    <div class="speaker" aria-hidden="true"></div>
    <div class="brand">NOKIA</div>

    <section class="screen-shell">
      <div class="screen">
        <div class="statusbar">
          <span>SCORE: <b id="score">0</b></span>
          <span>HI: <b id="highScore">0</b></span>
        </div>

        <canvas id="gameCanvas" aria-label="Snake game"></canvas>

        <div class="screen-overlay" id="overlay">
          <div class="overlay-title" id="overlayTitle">NOKIA</div>
          <div class="overlay-text" id="overlayText">PRESS 5 TO START</div>
        </div>
      </div>
    </section>

    <div class="softkeys" aria-hidden="true">
      <span>MENU</span>
      <span>OK</span>
      <span>BACK</span>
    </div>

    <section class="navigation" aria-label="Navigation controls">
      <button class="nav-btn" data-action="left" aria-label="Move left">◀</button>
      <button class="nav-center" id="okButton" aria-label="Pause or start">OK</button>
      <button class="nav-btn" data-action="right" aria-label="Move right">▶</button>
    </section>

    <section class="keypad" aria-label="Nokia keypad">
      <button class="key" data-key="1"><strong>1</strong></button>
      <button class="key" data-key="2"><strong>2</strong><small>ABC</small></button>
      <button class="key" data-key="3"><strong>3</strong><small>DEF</small></button>

      <button class="key" data-key="4"><strong>4</strong><small>GHI</small></button>
      <button class="key" data-key="5"><strong>5</strong><small>JKL</small></button>
      <button class="key" data-key="6"><strong>6</strong><small>MNO</small></button>

      <button class="key" data-key="7"><strong>7</strong><small>PQRS</small></button>
      <button class="key" data-key="8"><strong>8</strong><small>TUV</small></button>
      <button class="key" data-key="9"><strong>9</strong><small>WXYZ</small></button>

      <button class="key" data-key="*"><strong>*</strong></button>
      <button class="key" data-key="0"><strong>0</strong><small>+</small></button>
      <button class="key" data-key="#"><strong>#</strong></button>
    </section>

    <div class="hint">2 4 6 8 = MOVE &nbsp; • &nbsp; 5 = PAUSE / START</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
